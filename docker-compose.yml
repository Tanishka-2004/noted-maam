version: '3.8'

services:
  # --- Relational Database (PostgreSQL with pgvector) ---
  db:
    image: ankane/pgvector:v0.5.1
    container_name: noted-maam-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-noted_maam_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - noted-maam-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noted_maam_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache, Sessions, & Local Queue (Redis) ---
  redis:
    image: redis:7.2-alpine
    container_name: noted-maam-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - noted-maam-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Object Storage (MinIO) ---
  minio:
    image: minio/minio:RELEASE.2024-06-06T09-36-42Z
    container_name: noted-maam-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secure_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - noted-maam-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Python Backend Service (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noted-maam-backend
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-noted_maam_dev}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+psycopg://postgres:postgres_secure_pass@db:5432/noted_maam_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_admin_secure_pass}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-noted-maam-audio-chunks}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-9d8df283bc9dfc01bc89a7df2b89d8efd2389d83c27189defd893fcebdf89e1b}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - noted-maam-net

  # --- Next.js Frontend UI ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noted-maam-frontend
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - noted-maam-net

networks:
  noted-maam-net:
    name: noted-maam-network
    driver: bridge

volumes:
  postgres_data:
    name: noted-maam-postgres-vol
  redis_data:
    name: noted-maam-redis-vol
  minio_data:
    name: noted-maam-minio-vol
